cron_line = "0 0 1 1 * ~/bin/keepers status --drill"

[jobs.rotate]
line = "rotate"
cron = "*/10 3-4 * * *"
class = "T"
group = "timers"
queue = "critical"
where = "brain"
runs_on = "cron"
argv = ["~/bin/rotate", "run", "--cron"]
err = "out"
timeout = 120
after = 3
feature = "rotation"
owner_facing = false
why = "nightly fresh session in the quiet slot (silent when off, outside the window or not now)"
target = "cron-back 29.10"
cron_line = "*/10 3-4 * * * cron-fail --after 3 rotate flock -n -E 0 \"$HOME/.local/state/cron-fail/rotate.run\" timeout -k 10 120 $HOME/bin/rotate run --cron >/dev/null 2>&1"

[jobs.slo-cache]
line = "slo-cache"
cron = "*/15 * * * *"
class = "M"
group = "collectors"
queue = "fast"
where = "brain"
runs_on = "cron"
argv = ["~/bin/slo", "--cache"]
err = "out"
timeout = 300
after = 4
feature = "slo"
owner_facing = false
why = "keep the SLO tiles cache fresh for the hub feed"
target = "cron-back 29.10"
cron_line = "*/15 * * * * cron-fail --after 4 slo-cache flock -n -E 0 \"$HOME/.local/state/cron-fail/slo-cache.run\" timeout -k 10 300 $HOME/bin/slo --cache >/dev/null 2>&1"

[jobs.scorecard]
line = "scorecard"
cron = "7 * * * *"
class = "M"
group = "collectors"
queue = "fast"
where = "brain"
runs_on = "cron"
argv = ["~/bin/scorecard", "run", "--quiet"]
err = "out"
timeout = 300
after = 3
feature = "scorecard"
owner_facing = false
why = "hourly scorecard: speed and health vs a 7-day baseline, one inbox note per regressed metric per day"
target = "scorecard 30.10"
cron_line = "7 * * * * cron-fail --after 3 scorecard flock -n -E 0 \"$HOME/.local/state/cron-fail/scorecard.run\" timeout -k 10 300 $HOME/bin/scorecard run --quiet >/dev/null 2>&1"

[jobs.media-remux]
line = "media-remux"
cron = "*/20 * * * *"
class = "M"
group = "watches"
queue = "slow"
where = "brain"
runs_on = "cron"
argv = ["~/bin/media-remux", "--cron"]
out = "media-remux/cron.log"
err = "out"
dirs = ["media-remux"]
timeout = 900
after = 4
feature = "media"
owner_facing = false
why = "remux downgrade: old Default QP remuxes -> encodes, 1 grab per tick 00:30-06:00 (<= 15/night); follows imports"
target = "cron-back 29.10"
cron_line = "*/20 * * * * mkdir -p \"$HOME/.local/state/media-remux\" && cron-fail --after 4 media-remux flock -n -E 0 \"$HOME/.local/state/cron-fail/media-remux.run\" timeout -k 10 900 $HOME/bin/media-remux --cron >> \"$HOME/.local/state/media-remux/cron.log\" 2>&1"

# Five tagged ~/crontab lines: the voice and phone inbox polls and the nightly CI stay in cron; the media digests run
# from cron.
[jobs.voice-inbox]
line = "voice-inbox"
cron = "* * * * *"
class = "K"
group = "local"
queue = ""
where = "cron"
runs_on = "cron"
argv = ["timeout", "40", "~/bin/hub", "voice", "inbox", "--once", "--wait", "25"]
err = "out"
timeout = 60
after = 3
feature = "voice"
owner_facing = false
why = "the voice container's hand-offs to this session: one 25 s long-poll of the hub a minute (stays in cron)"
target = "voice relay on the hub"
cron_line = "* * * * * cron-fail --after 3 voice-inbox timeout 40 $HOME/bin/hub voice inbox --once --wait 25 >/dev/null 2>&1"

[jobs.phone-inbox]
line = "phone-inbox"
cron = "* * * * *"
class = "K"
group = "local"
queue = ""
where = "cron"
runs_on = "cron"
argv = []
shell = true
timeout = 60
after = 3
feature = "phone"
owner_facing = false
why = "the phone app's inbound (notes, zone, usage) from the hub: two 25 s long-polls a minute (stays in cron)"
target = "phone gateway on the hub"
cron_line = "* * * * * cron-fail --after 3 phone-inbox timeout 58 sh -c 'hub phone inbox --once --wait 25 && hub phone inbox --once --wait 25'"

[jobs.ci-nightly]
line = "ci-nightly"
cron = "10 2 * * *"
class = "K"
group = "local"
queue = ""
where = "cron"
runs_on = "cron"
argv = ["nice", "-n", "10", "~/bin/assistant", "ci-nightly"]
err = "out"
timeout = 7200
after = 1
feature = "ci"
owner_facing = false
why = "main's full suite every night; red or a stale quarantine entry -> one ~/inbox note (stays in cron)"
target = "land-speed"
cron_line = "10 2 * * * nice -n 10 cron-fail ci-nightly $HOME/bin/assistant ci-nightly >/dev/null 2>&1"

[jobs.land-queue]
line = "land-queue"
cron = "*/5 * * * *"
class = "K"
group = "local"
queue = ""
where = "cron"
runs_on = "cron"
argv = ["~/bin/assistant", "land", "--worker", "--cron"]
err = "out"
timeout = 7200
after = 6
feature = "ci"
owner_facing = false
why = "the land queue's worker after a restart or a crash: picks up what is queued with nobody waiting (--no-wait lands); nothing to do = exits at once, a running worker = exits at once (one at a time by its own lock); no timeout: a batch's land may run its eval subset"
target = "land-queue"
cron_line = "*/5 * * * * cron-fail --after 6 land-queue $HOME/bin/assistant land --worker --cron >/dev/null 2>&1"

[jobs.media-digest-daily]
line = "media-digest-daily"
cron = "0 19 * * *"
class = "M"
group = "collectors"
queue = "slow"
where = "brain"
runs_on = "cron"
argv = ["timeout", "600", "~/bin/media", "digest", "--daily"]
out = "media/digest-cron.log"
err = "out"
dirs = ["media"]
timeout = 620
after = 1
ok = [3]
feature = "media"
owner_facing = true
why = "daily media digest cards (switch: ~/.config/media/digest.json)"
target = "media-digest"
cron_line = "0 19 * * * mkdir -p \"$HOME/.local/state/media\" && cron-fail --ok 3 media-digest-daily timeout 600 $HOME/bin/media digest --daily >> \"$HOME/.local/state/media/digest-cron.log\" 2>&1"

[jobs.media-digest-weekly]
line = "media-digest-weekly"
cron = "5 19 * * 0"
class = "M"
group = "collectors"
queue = "slow"
where = "brain"
runs_on = "cron"
argv = ["timeout", "600", "~/bin/media", "digest", "--weekly"]
out = "media/digest-cron.log"
err = "out"
dirs = ["media"]
timeout = 620
after = 1
ok = [3]
feature = "media"
owner_facing = true
why = "weekly media digest cards (switch: ~/.config/media/digest.json)"
target = "media-digest"
cron_line = "5 19 * * 0 mkdir -p \"$HOME/.local/state/media\" && cron-fail --ok 3 media-digest-weekly timeout 600 $HOME/bin/media digest --weekly >> \"$HOME/.local/state/media/digest-cron.log\" 2>&1"

# A token-free watch of the claude.ai usage limit (the 24.-28.10 pause went unnoticed for 4 days): stays in cron so it
# runs whatever the session and the hub do.
[jobs.usage-watch]
line = "usage-watch"
cron = "3-59/10 * * * *"
class = "K"
group = "local"
queue = ""
where = "cron"
runs_on = "cron"
argv = ["~/bin/usage-watch", "run"]
err = "out"
timeout = 120
after = 3
feature = "usage-watch"
owner_facing = true
why = "claude.ai usage limit hit or cleared -> ONE plain tg line per state change, held to 08:00 (no model calls)"
target = "usage-watch"
cron_line = "3-59/10 * * * * cron-fail --after 3 usage-watch $HOME/bin/usage-watch run >/dev/null 2>&1"

[jobs.cron-runs]
line = "cron-runs"
cron = "*/5 * * * *"
class = "K"
group = "collectors"
where = "cron"
runs_on = "cron"
argv = ["~/bin/cron-runs", "export", "--quiet"]
err = "out"
timeout = 120
after = 6
feature = "health"
owner_facing = false
why = "cron jobs' run log (cron-fail runs-*.jsonl) -> one Phoenix span per run via the local OTLP receiver (cron-back 29.10)"
target = "cron-back 29.10"
cron_line = "*/5 * * * * cron-fail --after 6 cron-runs flock -n -E 0 \"$HOME/.local/state/cron-fail/cron-runs.run\" timeout -k 10 120 $HOME/bin/cron-runs export --quiet >/dev/null 2>&1"
