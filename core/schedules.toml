# The schedule registry: every periodic job, one table each. Data, not logic. Edited by hand or by the tools.
# Fields: line (its crontab tag; jobs sharing a line name the same one), cron (5 fields, wall time in the owner's
# zone: the profile's locale.tz; a top-level tz = "Area/City" here would override it),
# argv (no shell; a leading ~/ = $HOME; empty = the line needs a shell and a managed wrapper before it
# can move: shell = true), out / err (under ~/.local/state; "out" = stderr with stdout; none = discarded),
# dirs (state folders made first), env, timeout (s; a hub schedule waits that long, at most 3600),
# after / ok (cron-fail's --after / --ok; after 0 = no failure events), class (W watch · X critical ·
# T timer · C cue · V vault · M moves · R retire · K stays in cron), group, queue (critical | fast | slow;
# none for K/R), where (brain = the tool worker here, hub, cron, retire), runs_on (cron = its tagged
# ~/crontab line · hub = a hub schedule, no cron line · keepers = the `keepers` line · planned = no
# runner · retired · window = the hub's event-window clocks while one is open, `eventwf`), feature,
# owner_only (true = this deployment's own job, kept in its crontab and checked by `assistant cron check`, but never
# scheduled by `assistant cron install`: its skill is not shipped in templates/ or it needs this deployment's own
# setup), owner_facing, why, target (the change that set its runner; cron-back selects by it), keeper + every
# (minutes; `keepers ensure`), cron_line (the exact crontab line, untagged),
# catch_up (a hub schedule runs a tick missed while the hub was down once, late, within min(cadence/2, 6 h);
# default true for daily-or-slower crons, false otherwise; true needs one minute value; false = skip it).
schema = 1

[jobs.tg-status]
line = "tg-status"
cron = "*/5 * * * *"
class = "M"
group = "collectors"
queue = "fast"
where = "brain"
runs_on = "cron"
argv = ["~/bin/tg-status", "refresh"]
err = "out"
timeout = 300
after = 6
feature = "status-board"
owner_facing = true
why = "refresh the pinned Telegram status board"
target = "cron-back 29.10"
cron_line = "*/5 * * * * cron-fail --after 6 tg-status flock -n -E 0 \"$HOME/.local/state/cron-fail/tg-status.run\" timeout -k 10 300 $HOME/bin/tg-status refresh >/dev/null 2>&1"

