# Every rule of every PreToolUse/PostToolUse guard, what it protects, how
# often it fired, what covers it now and the proposed decision. Owner-readable version + evidence:
# ~/reports/plans/v2-h11-guards.md. tests/guards/test_h11_reduced.py checks this table against the code.
#
# fires: from the hooks' own logs, decision counts only (no command text):
#   risk-check   ~/.local/state/risk-check.log, 14.10 23:00 .. 22.10 18:12 (the log holds nothing older)
#   vault-guard  ~/.local/state/vault-guard/blocked.log, 10.10 .. 22.10 (rule names only by design)
#   webagent     ~/.local/state/webagent/guard.log, 21.10 .. 22.10;  no-approval  its log, 08.10 .. 16.10
#   allow = logged MEDIUM (the call ran), block = denied, override = ran with the owner's risk-ok code
# covered: keep (a keep class: never retired) · boundary (a hard boundary CLAUDE.md names; stays) · gateway-later
#   (retires once its hub domain is ENFORCED in Cedar and its credential has left this container) ·
#   target-gone (verified 22.10: nothing it guards is reachable where it is retired) · log-only (never blocks, no
#   reader of its log lines) · duplicate (another layer that stays catches the same thing) · browser-gate
# decision: keep · retire-now (everywhere) · retire-scoped (only on the machines in scope; stays elsewhere) ·
#   retire-later (gateway-later; not in reduced-v1)
# Verified 22.10 (read-only): no block device in /dev and CapEff 0 in this container; no docker, mail, mdcmd, zfs,
# btrfs, parted/fdisk binaries here; nothing mounted under /mnt; the server key is forced into dispatcher 3.1
# (`unraid-ssh status`: resolved verbs, hello hash = the reviewed local copy). Assumed: his other LAN boxes (e.g. the
# UniFi OS VM, reachable as a normal user) can run any of these, so scoped rules stay there.

