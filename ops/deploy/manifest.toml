# Managed files: written only by `assistant deploy` (via `assistant land`). dest is relative to $HOME.
# Per [[file]]: src (repo path), dest, mode (default 0755 under bin/, else 0644), header (default true: the managed
# header line goes after the shebang), smoke (sh command after install; {dest} {home} {lib} are shell-quoted),
# suite (legacy suite ~/opt/<suite>-tests run by `assistant ci` against a staged bin overlay), seam (env var that
# suite reads for the binary under test; default NAME_BIN).
# [core]: the stdlib library tree, installed as dest -> dest.releases/<release>/core (atomic symlink, last 3 kept).

[core]
src = "core"
dest = "bin/lib/core"
smoke = "/usr/bin/python3 -I -c \"import sys; sys.path.insert(0, sys.argv[1]); import core.paths, core.clock, core.jsonstate, core.locks, core.http, core.notes, core.tg; core.clock.now()\" {lib}"

[[file]]
src = "ops/assistant.py"
dest = "bin/assistant"
mode = "0755"
smoke = "{dest} --version"

# Memory records: `memory` = FACTS.md facts and ledger lines as rows in mem.db (schema 2, additive
