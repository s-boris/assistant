# Images of the hub stack (ops/hub/compose.yaml), pinned by index digest (multi-arch). Two-week rule: pin a tag only
# when it was pushed on or before pyproject's [tool.uv] exclude-newer; tests/hub/test_compose.py checks both, and that
# compose.yaml uses exactly these refs. size_mb = amd64, compressed (what a pull adds to docker.img).
# Bump: newer tag + its digest + push date (Docker Hub tag API), after exclude-newer moves past that date.
# A deliberate early bump (security fix) carries `exception = "why"`; drop it once exclude-newer passes `pushed`.

