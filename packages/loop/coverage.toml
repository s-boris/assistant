# Loop coverage map: every part of the system and the loop steps that read it (`loop coverage`).
#
# A part claims registry members; the drift test (tests/loop/test_coverage.py) and the self-review collector
# `coverage` derive the members from the live registries and fail / raise a finding when one is unclaimed or a part
# has no loop step. Registries: core/schedules.toml (job features, job names), the hub kit's containers
# (packages/hubkit CONTAINERS + ops/*/compose*.yaml container_name), the typed tools (packages/tools/domains, by
# domain), the egress bindings (packages/hub/policy/egress.toml), and when present on the box: the skills and
# agents dirs and the enabled plugins.
#
# Steps (ids below): review = self-review (docs = (a)-(e) over CLAUDE/JOBS/TOOLS.md, skills, agents, memory;
# f = eval regression; g:* = loop signals; h:* = setup-health collectors), scorecard = loop.scorecard metric,
# ideas = idea-scan input, cleanup = self-cleanup check, stack = stack research topic, evals = eval area.
# Derived per run from schedules.toml (not listed by hand): h:joberr for every job, h:cronlogs for jobs with a
# `>>` log, h:hubjobs for keeper and hub-schedule jobs, scorecard cron_fail for jobs run through cron-fail.
# status = "in-progress" marks a part whose sources another change is adding (it may have no step yet).
# No personal values here: the repo is exported publicly.

schema = 1
external_containers = ["claude-vault"]

[steps.review]
docs = "(a)-(e) changed lines of CLAUDE.md, JOBS.md, TOOLS.md, skills, agents, memory"
f = "(f) eval regression of the latest self-evals run"
"g:traces" = "loop signal: first reply, hook blocks, heartbeat turns (traces report)"
"g:beats" = "loop signal: heartbeat beats (events metrics --beats)"
"g:usage" = "loop signal: per-feature usage flags broken/slow/friction (product report)"
"g:evals" = "loop signal: eval summary"
"g:denials" = "loop signal: gateway denials per tool domain (tool policy)"
"g:reflexes" = "loop signal: reflex firings"
"g:corrections" = "loop signal: owner corrections -> fact rows + eval cases"
"g:health" = "loop signal: the (h) findings as H1 candidates"
"g:ci" = "loop signal: shared CI blockers"
"g:cost" = "loop signal: cost per agent run"
"h:land" = "(h) land/deploy log, CI records, shared CI blockers"
"h:hubjobs" = "(h) hub workflow runs, catch-up, keepers"
"h:joberr" = "(h) job .err files, failure notes"
"h:cronlogs" = "(h) crontab logs"
"h:traces" = "(h) traces.db: tool errors, hook blocks, first reply, agents"
"h:phoenix" = "(h) Phoenix spans: latency, errors, tokens, cost"
"h:agents" = "(h) agent-watch transitions"
"h:events" = "(h) event ledger: unacked, emit errors, restarts"
"h:slo" = "(h) SLO tiles 24 h vs 7 d"
"h:evals" = "(h) evals history: infra errors"
"h:hub" = "(h) hub health: checks ci/pg/phoenix, gateway, runner, egress counters"
"h:server" = "(h) server health: docker, disks, VMs (read-only verb)"
"h:hooks" = "(h) hook decisions by rule name"
"h:board" = "(h) board-lint"
"h:vault" = "(h) vault health counts: status, metrics, alerts, audit per event, log signatures, repo"
"h:parts" = "(h) part checks: own containers by name, media, voice, web agent, reminders overdue, HA health watch"
"h:coverage" = "(h) this map against the live registries"
"h:phone" = "(h) phone app: gateway up/restarts, self-test check ids, push p95, connects, crashes, phone-inbox, phone.* tools"

[steps.scorecard]
reply_p95 = "first reply to his messages, p95"
helper_p95 = "helper run time, p95"
cost_day = "cost per 24 h"
tokens_day = "tokens per 24 h"
land_p95 = "land time of green lands, p95"
land_fail = "failed share of land attempts"
vault_wait_p95 = "vault LLM wait (live lane), p95"
cron_fail = "failed share of cron runs"
push_p95 = "phone push delivery (send to the app's ack), p95"

# marker = text the live agent file must contain for the input or check to count (checked when the file is present)
[steps.ideas]
context = { desc = "0 context snapshot: server, weather, next 7 days, HN", marker = "~/.local/state/context/today.md" }
signals = { desc = "0 signal categories (counts per type/topic)", marker = "signals.json" }
calendar = { desc = "0 next 7 days of calendar", marker = "list_events" }
goals = { desc = "1 GOALS.md", marker = "~/workspace/GOALS.md" }
problems = { desc = "2 PROBLEMS.md", marker = "~/workspace/PROBLEMS.md" }
todo = { desc = "3 TODO.md Ideas + Waiting", marker = "~/workspace/TODO.md" }
changelog = { desc = "4 PROACTIVE/CHANGELOG tails", marker = "CHANGELOG.md" }
unraid-report = { desc = "5 newest Unraid report", marker = "~/reports/unraid/" }
vault = { desc = "5b vault health counts, repo log, open issues", marker = "vault metrics --days 7" }
phone = { desc = "5c the phone app: readings, status, usage, repo log", marker = "5c. The phone app" }
health = { desc = "5d setup health findings, scorecard, coverage gaps", marker = "loop coverage --gaps" }
inventory = { desc = "6 ~/bin, skills, agents, crontab, earlier scans", marker = "ls ~/bin ~/.claude/skills ~/.claude/agents" }
memory = { desc = "7 MEMORY.md index", marker = "MEMORY.md" }
product = { desc = "7b product review + per-feature usage", marker = "product report --days 30" }
web = { desc = "8 web news on his stack (stack topics)", marker = "new releases and notable changes for his stack" }

[steps.cleanup]
usage = { desc = "1 usage of ~/bin scripts, skills, agents, cron lines", marker = "Usage evidence for each ~/bin script" }
config = { desc = "2 dead config, watches, reminders, state dirs, old reports", marker = "Dead config" }
duplication = { desc = "3 duplication, overlong docs", marker = "Duplication and mess" }
workspace = { desc = "4 TODO/GOALS/PROBLEMS, memory", marker = "Workspace hygiene" }
slim = { desc = "6 slim ~/bin", marker = "Slim the code" }
disk = { desc = "7 disk: cache, state, logs", marker = "Disk:" }
findings = { desc = "8 open self-review findings", marker = "self-review open" }
menu = { desc = "9 Telegram menu usage", marker = "menu-usage --brief" }
product = { desc = "10 product usage", marker = "product report --days 30" }
vault = { desc = "11 vault repo, health counts, issues", marker = "The vault (see" }
phone = { desc = "12 the phone app: red checks, push delay, crashes, tests", marker = "12. The phone app" }
monorepo = { desc = "13 monorepo + hub registries, ~/jobs, coverage gaps", marker = "loop coverage --gaps" }

# match = regex on ~/reports/stack/*.md file names; the rotation takes the topic whose newest report is oldest
[steps.stack]
unraid = { desc = "Unraid OS, plugins, Nvidia driver", match = "unraid" }
arr = { desc = "Sonarr, Radarr, Seerr, Bazarr, SABnzbd, Tracearr", match = "arr|sonarr|radarr|seerr|bazarr" }
emby = { desc = "Emby server and clients", match = "emby" }
paperless = { desc = "paperless-ngx", match = "paperless" }
ha = { desc = "Home Assistant core/OS, ZHA, WLED, Matter", match = "-ha-|-ha\\.|home-assistant|wled" }
firefly = { desc = "Firefly III, data importer", match = "firefly" }
unifi = { desc = "UniFi OS Server, Network app", match = "unifi" }
claude-code = { desc = "Claude Code, MCP, Agent SDK, plugins", match = "claude-code|mcp" }
vault-stack = { desc = "llama.cpp server, Gemma GGUF + embedding models, Telethon, sqlite-vec, Debian base, pinned deps", match = "vault|llama|gemma|embedding" }
hub-stack = { desc = "Phoenix, Postgres, FastMCP, Python 3.13 deps (requirements.lock), uv", match = "hub|phoenix|postgres|fastmcp" }
browser = { desc = "Chrome in claude-hub-browser, the browser MCP", match = "browser|chrome" }
voice-stack = { desc = "whisper server, the voice relay's realtime model", match = "voice|whisper" }
edge = { desc = "nginx VM, tunnel, dashboard publish", match = "nginx|tunnel|dash" }
android = { desc = "the phone app's Android stack", match = "android|phone" }
swiss-admin = { desc = "e-banking exports, eBill, tax software for his canton", match = "ebill|tax|admin" }

# ------------------------------------------------------------------------------------------------ parts
[[part]]
id = "bot-session"
title = "claude-bot: main session, sessions, model, tokens, sleep-in"
containers = ["claude-bot"]
features = ["brain", "tokens", "sleep-in", "usage-watch"]
review = ["h:traces", "h:phoenix", "h:agents", "h:slo", "h:parts", "g:traces", "g:cost", "g:reflexes"]
scorecard = ["reply_p95", "helper_p95", "cost_day", "tokens_day"]
ideas = ["context", "changelog", "inventory", "health"]
cleanup = ["usage", "config", "disk"]
stack = ["claude-code"]
evals = ["conduct", "core-context"]

[[part]]
id = "hooks"
title = "hooks: vault-guard, risk-check, subagent rules, hub stamp, usage, conduct"
review = ["docs", "h:hooks", "h:traces"]
ideas = ["health"]
cleanup = ["duplication"]
stack = ["claude-code"]
evals = ["security"]

[[part]]
id = "heartbeat"
title = "heartbeat plugin, hb-gate, wake rules"
plugins = ["heartbeat"]
review = ["g:beats", "h:events"]
ideas = ["health"]
cleanup = ["usage"]
stack = ["claude-code"]
evals = ["heartbeat"]

[[part]]
id = "rotation"
