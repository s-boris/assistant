# The brain's scheduled cues, typed cue.<name> events from hub schedules (`cue NAME`, registry
# class C; waiting-nudge writes its own). Each writes its row and the identical note (inbox.writer); the note names keep
# their kind's filename prefix, so ingest gives the note the same kind. Payload: payloads/cue.schema.json.
[kinds."cue.weekly-digest"]
match = ["digest-*"]
labels = ["cue", "owner"]
hint = "weekly-digest subagent at xhigh, review, one rich message (+ up to 3 Watch buttons); archive ~/reports/digest/"
jobs = "Owner-facing"
payload = "payloads/cue.schema.json"

[kinds."cue.birthdays"]
match = ["birthdays-*"]
labels = ["cue", "people"]
hint = "birthdays in the next 7 days: one message only if any; then the silent 60-day calendar details pass"
jobs = "Owner-facing"
payload = "payloads/cue.schema.json"

[kinds."cue.idea-scan"]
match = ["idea-scan-*"]
labels = ["cue", "goals"]
hint = "idea-scan subagent at high: TODO.md Ideas >= 10, update GOALS.md"
jobs = "Goal loop"
payload = "payloads/cue.schema.json"

[kinds."cue.self-cleanup"]
match = ["self-cleanup-*"]
labels = ["cue", "system"]
hint = "self-cleanup subagent at xhigh, then one message: what was retired + Needs his OK buttons"
jobs = "Goal loop"
payload = "payloads/cue.schema.json"

[kinds."cue.calendar-gap-pass"]
match = ["calendar-gap-pass-*"]
labels = ["calendar", "cue"]
hint = "skill calendar-gap-pass (next 14 days: travel legs, missing details); silent unless a decision is needed"
jobs = "Goal loop"
payload = "payloads/cue.schema.json"

[kinds."cue.daily-plan"]
match = ["daily-plan-*"]
labels = ["cue", "goals"]
hint = "pick 1-3 GOALS.md steps and start the first; no message (a 🛒 line: one short line to him)"
jobs = "Goal loop"
payload = "payloads/cue.schema.json"

[kinds."cue.waiting-nudge"]
match = ["waiting-nudge-*"]
labels = ["board", "cue"]
hint = "ask him about 1-3 Waiting on you items at a relaxed time, then waiting-nudge asked"
jobs = "Owner-facing"
payload = "payloads/cue.schema.json"

# Failure streaks of jobs the harness runs itself (hub schedules via workflow.job, `keepers ensure`), with
# cron.fail's --after/--ok semantics (core.jobfail). job.recovered and schedule.changed are
# typed rows without a note (digest; payload schemas in payloads/), so they need no entry here.
[kinds."job.failed"]
match = ["*-jobfail-*"]
regex = '^(?P<job>.+?)-jobfail-\d{6,}(?:-\d+)?(?:\.md)?$'
priority = 11
delivery = "beat"
labels = ["failure"]
hint = "read the job's .err through secretscan --redact, fix the job, then ack"
jobs = "Recurring jobs (reference)"
payload = "payloads/job.failed.schema.json"
[kinds."job.failed".label_lines]
recovered = '^Recovered '

[kinds."hub.down"]
match = ["hub-sentinel-*"]
priority = 10
delivery = "now"
labels = ["failure", "hub"]
hint = "hub status; hub health --json; fix the hub or tell him"
jobs = "Recurring jobs (reference)"

# Shared CI blockers (ops/assistant.py land path, core.ciblock): what stops EVERY land (a suite red on main, the hub
# runner refusing a submit or giving no signed record). Raised the moment a land sees one, deduped per blocker ~2 h.
[kinds."ci.blocked"]
match = ["ci-blocked-*"]
priority = 10
delivery = "now"
labels = ["failure", "ci"]
hint = "a shared CI blocker stops every land: assistant ci-status; fix it (or hand it to one helper), then ack"
jobs = "Self-maintenance (nightly, no tokens)"
payload = "payloads/ci.blocked.schema.json"
