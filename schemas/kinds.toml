# Kind registry: defaults for the busiest event kinds. Data, not logic: the brain changes delivery with `wake`
# rules; these are only the starting values, the one-line hint the agenda shows when a note has no Next line,
# and the JOBS.md section that documents the handling.
#
# [kinds."<kind>"]
#   match       filename globs of the ~/inbox notes this kind covers (ingest); the most specific match wins:
#               higher priority first, then the longer literal prefix before the first wildcard
#   regex       optional, on the filename: the entry matches only when a glob AND the regex match; named groups
#               go into the event payload (e.g. the failed job's name)
#   priority    optional int (default 0)
#   delivery    now | beat | digest | mute   (default beat)
#   labels      free tags
#   hint        one line: how it is handled (shown only when the note has no "Next:" line)
#   jobs        the JOBS.md section with the full handling (its heading, or the heading's start before " (")
#   payload     optional: the JSON Schema (schemas/payloads/) of the typed payload a writer emits for this kind
#   [kinds."<kind>".label_lines]   label = regex (multiline) on the note text; a match adds the label
# A note no entry matches becomes note.<prefix> (the filename up to its first number/date/hash part).
schema = 1

[kinds."cron.fail"]
match = ["*-failed-*"]
regex = '^(?P<job>.+?)-failed-\d{6,}(?:-\d+)?(?:\.md)?$'
priority = 10
delivery = "beat"
labels = ["failure"]
hint = "read the job's .err through secretscan --redact, fix the job, then ack"
jobs = "Recurring jobs (reference)"
payload = "payloads/cron.fail.schema.json"
[kinds."cron.fail".label_lines]
recovered = '^Recovered '

