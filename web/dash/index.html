<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--dash:head-->
<title>Claude Bot Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 30 30%27%3E%3Ccircle cx=%2715%27 cy=%2715%27 r=%2713%27 fill=%27%23b4441f%27/%3E%3Cpath d=%27M5 18.5c3.2-2.6 6.6-2.6 10 0s6.8 2.6 10 0%27 fill=%27none%27 stroke=%27%23f7f5f1%27 stroke-width=%272.2%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
/* Look: "Ember & Lagoon", the phone app's theme (warm neutrals, ember primary, lagoon secondary, Geist + Geist Mono,
   tabular numbers, soft 20/16/12 px radii). Layout: phone-first single column under a sticky tab bar; cards pair up
   from 760 px. Colors are tokens only: light here, dark under prefers-color-scheme and [data-theme="dark"]. */
@font-face { font-family: "Geist"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/geist_400.woff2") format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/geist_500.woff2") format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 600 700; font-style: normal; font-display: swap; src: url("fonts/geist_600.woff2") format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 400 600; font-style: normal; font-display: swap; src: url("fonts/geist_mono_500.woff2") format("woff2"); }
:root {
  --page: #f7f5f1;
  --surface: #ffffff;
  --surface-2: #ece8e2;
  --surface-3: #f2efea;
  --ink: #1c1a17;
  --ink-2: #57514a;
  --muted: #6b645c;
  --grid: #e6e1da;
  --axis: #d3ccc3;
  --border: rgba(28, 26, 23, 0.09);
  --accent: #b4441f;
  --accent-ink: #9c3a1a;
  --accent-wash: #fbe7dd;
  --lagoon: #0f6a78;
  --lagoon-ink: #0b5864;
  --lagoon-wash: #dcf0f2;
  --quiet: rgba(15, 106, 120, 0.06);
  --s1: #0f6a78;
  --s2: #c4532a;
  --s3: #b07a12;
  --s4: #6f8f3c;
  --s5: #9a5b8f;
  --s6: #3d6aa8;
  --s7: #8a7a66;
  --s8: #c0392b;
  --good: #0f6a78;
  --good-ink: #0b5864;
  --good-wash: #dcf0f2;
  --warning: #c98a0b;
  --warning-ink: #8a5a00;
  --warning-wash: #f6e3be;
  --serious: #c4532a;
  --serious-ink: #9c3a1a;
  --critical: #b3261e;
  --critical-ink: #9a1f18;
  --critical-wash: #f9dedc;
  --n-cloud: #fbe7dd;
  --n-lan: #f2efea;
  --n-vault: #dcf0f2;
  --n-me: #f6ecdf;
  --n-hub: #e6ecf5;
  --tip-bg: #ffffff;
  --shadow: 0 8px 28px rgba(28, 26, 23, 0.12);
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r: 20px;
  --r-tile: 16px;
  --r-chip: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #141311; --surface: #1c1a17; --surface-2: #2b2925; --surface-3: #211f1c; --ink: #ece6df; --ink-2: #c2b9af;
    --muted: #9c9389; --grid: #2b2925; --axis: #48433d; --border: rgba(236, 230, 223, 0.09); --accent: #ffa27f;
    --accent-ink: #ffb596; --accent-wash: #3a2219; --lagoon: #7fd3de; --lagoon-ink: #9fe0e8; --lagoon-wash: #0f3a40;
    --quiet: rgba(127, 211, 222, 0.07); --s1: #7fd3de; --s2: #ff9a72; --s3: #f0c36d; --s4: #a9c97a; --s5: #d79bcb;
    --s6: #8fb3ea; --s7: #c2b2a0; --s8: #f28b82; --good: #7fd3de; --good-ink: #9fe0e8; --good-wash: #0f3a40;
    --warning: #f0c36d; --warning-ink: #f0c36d; --warning-wash: #3d2e0a; --serious: #ff9a72; --serious-ink: #ffb596;
    --critical: #f2b8b5; --critical-ink: #f2b8b5; --critical-wash: #4a1a17; --n-cloud: #3a2219; --n-lan: #211f1c;
    --n-vault: #0f3a40; --n-me: #2b2420; --n-hub: #1b2431; --tip-bg: #2b2925; --shadow: 0 8px 28px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #141311; --surface: #1c1a17; --surface-2: #2b2925; --surface-3: #211f1c; --ink: #ece6df; --ink-2: #c2b9af;
  --muted: #9c9389; --grid: #2b2925; --axis: #48433d; --border: rgba(236, 230, 223, 0.09); --accent: #ffa27f;
  --accent-ink: #ffb596; --accent-wash: #3a2219; --lagoon: #7fd3de; --lagoon-ink: #9fe0e8; --lagoon-wash: #0f3a40;
  --quiet: rgba(127, 211, 222, 0.07); --s1: #7fd3de; --s2: #ff9a72; --s3: #f0c36d; --s4: #a9c97a; --s5: #d79bcb;
  --s6: #8fb3ea; --s7: #c2b2a0; --s8: #f28b82; --good: #7fd3de; --good-ink: #9fe0e8; --good-wash: #0f3a40;
  --warning: #f0c36d; --warning-ink: #f0c36d; --warning-wash: #3d2e0a; --serious: #ff9a72; --serious-ink: #ffb596;
  --critical: #f2b8b5; --critical-ink: #f2b8b5; --critical-wash: #4a1a17; --n-cloud: #3a2219; --n-lan: #211f1c;
  --n-vault: #0f3a40; --n-me: #2b2420; --n-hub: #1b2431; --tip-bg: #2b2925; --shadow: 0 8px 28px rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 var(--font-ui); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 650; }
h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); }
p { margin: 0; }
a { color: var(--accent-ink); }
.mono { font-family: var(--font-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* header + tabs */
.top { padding-block: 18px 10px; display: grid; gap: 6px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.statusline { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px 3px 8px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.state.working { background: var(--lagoon-wash); color: var(--lagoon-ink); }
.state.working .dot { background: var(--lagoon); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .state.working .dot { animation: none; } }
.fresh { font-size: 12.5px; color: var(--muted); }
.fresh.stale { color: var(--warning-ink); font-weight: 600; }
.fresh .stale-mark { margin-left: 8px; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 999px; background: var(--warning-wash); color: var(--warning-ink); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page);
  margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--border); }
.tabs-inner { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 550; color: var(--ink-2);
  padding: 11px 9px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.tab:focus-visible, button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* panels */
section.view { display: grid; gap: 14px; padding-top: 16px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; display: grid;
  gap: 10px; min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.note { font-size: 12.5px; color: var(--muted); }

/* overview */
.hero { display: grid; gap: 4px; }
.hero .value { font-size: 52px; line-height: 1.05; font-weight: 650; letter-spacing: -0.02em; }
.hero .value small { font-size: 22px; font-weight: 550; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.tile .label { font-size: 12.5px; color: var(--ink-2); }
.tile .value { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.tile .sub { font-size: 12.5px; color: var(--muted); }
.tile.wide { grid-column: 1 / -1; gap: 6px; }
.pace { display: grid; gap: 6px; margin-bottom: 10px; }
.pace-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.meter { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter .fill { height: 100%; border-radius: 999px; background: var(--accent); }
.meter .mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
.sw.dash { height: 0; border-top: 2px dashed var(--ink-2); border-radius: 0; width: 14px; }
.sw.dot { border-radius: 50%; background: var(--s4); }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.plain li { min-width: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.linkbtn { appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font: inherit;
  font-size: 13px; font-weight: 550; padding: 6px 12px; border-radius: 999px; cursor: pointer; justify-self: start; }
.linkbtn:hover { border-color: var(--axis); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip .ico { font-size: 10px; }
.chip.ok { color: var(--good-ink); }
.chip.ok .ico { color: var(--good); }
.chip.warn { color: var(--warning-ink); }
.chip.warn .ico { color: var(--warning); }
.chip.critical { color: var(--critical-ink); }
.chip.critical .ico { color: var(--critical); }
.chip.serious { color: var(--serious-ink); }
.chip.serious .ico { color: var(--serious); }
.chip.accent { background: var(--accent-wash); color: var(--accent-ink); }
.chip.off { text-decoration: line-through; }

/* charts */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 2px; }
.seg button { appearance: none; border: 0; background: none; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.shade { background: var(--quiet); outline: 1px solid var(--grid); }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart svg:focus { outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.tip { position: absolute; pointer-events: none; z-index: 3; background: var(--tip-bg); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px; min-width: 150px; display: grid; gap: 3px; }
.tip .t { font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
.tip .r { display: grid; grid-template-columns: 14px auto 1fr; align-items: center; gap: 6px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span:last-child { color: var(--ink-2); }
.tip .k { width: 12px; height: 2px; border-radius: 1px; }
details.table { font-size: 13px; }
details.table summary { cursor: pointer; color: var(--ink-2); font-weight: 550; width: max-content; }
.tablewrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

/* ranked bars */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; gap: 4px; min-width: 0; }
.bar-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13.5px; }
.bar-top .name { min-width: 0; overflow-wrap: anywhere; }
.bar-top .val { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-2); }
.bar-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.track { height: 8px; }
.fill { height: 8px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }

/* lists */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
.timeline li:last-child { border-bottom: 0; }
.timeline .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.timeline .what { min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.cron li { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.cron li:last-child { border-bottom: 0; }
.cron .row1 { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 14px; }
.cron .row1 b { font-weight: 600; }
.cron .row2 { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.cron li.disabled .row1 { color: var(--muted); }
.todo-group { display: grid; gap: 6px; }
.todo-group h3 { display: flex; gap: 6px; align-items: center; }
.count { font-size: 11.5px; font-weight: 650; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.empty { color: var(--muted); font-size: 13.5px; }
/* goals, today, context */
ul.goals { gap: 12px; }
.goal { display: grid; gap: 5px; }
.goal-title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.goal .meter { height: 6px; }
.done-metrics { margin-top: 16px; }
.done-metrics .tablewrap { margin-top: 4px; }
.done-metrics .note { margin: 6px 0 0; }
.hn li a { text-decoration: none; font-weight: 550; }
.hn li a:hover { text-decoration: underline; }
.hn .chip, .done-list .chip { margin-left: 2px; }
.nights { display: grid; gap: 6px; padding: 8px 0 0; }
.nights p { margin: 0; }
details.night .done-list { padding: 6px 0 4px 12px; }
.skills { display: grid; gap: 8px; }
.strip { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--ink-2); }
.strip b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.skills div { font-size: 13.5px; overflow-wrap: anywhere; }
.skills b { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }

/* data map */
.highlights { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .highlights { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hl { border: 1px solid var(--border); border-radius: var(--r); padding: 12px; background: var(--surface); display: grid; gap: 4px; }
.hl.high { border-color: var(--serious); }
.hl.good { border-color: var(--good); }
.hl h3 { color: var(--ink); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.hl p { font-size: 13.5px; color: var(--ink-2); }
.hl ul { margin: 2px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }
.dlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.dlegend span { display: inline-flex; gap: 6px; align-items: center; }
.dlegend svg { width: 26px; height: 8px; }
.gsw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; }
.flows { list-style: none; margin: 0; padding: 0; display: grid; }
.flows li { display: grid; gap: 3px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
.flows li:last-child { border-bottom: 0; }
.flows .route { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 14px; font-weight: 600; }
.flows .route .arrow { color: var(--muted); font-weight: 400; }
.flows .d { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.flows .t { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.stores { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .stores { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.store { border: 1px solid var(--border); border-radius: var(--r); padding: 12px; display: grid; gap: 4px; background: var(--surface); min-width: 0; }
.store .head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.store .head b { font-size: 14px; }
.store .w { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.store .h { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.store .live-size { font-size: 12.5px; font-family: var(--font-mono); color: var(--ink-2); }
.filterbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* data tab: live vault tiles, grouped flows, compact stores */
.vault-live { display: grid; gap: 8px; }
@media (min-width: 760px) { .tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tiles.four .tile { align-content: start; }
.tile .delta { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile .chip { justify-self: start; margin: 2px 0; }
.tile.reads { position: relative; }
.spark { margin: 4px 0 2px; max-width: 220px; }
.spark svg { overflow: visible; }
.spark .base { stroke: var(--axis); stroke-width: 1; }
.spark .col { fill: var(--axis); }
.spark .col.today { fill: var(--s1); }
.spark .dl { font: 9.5px var(--font-ui); fill: var(--muted); }
.spark .dl.today { fill: var(--ink-2); font-weight: 600; }
.spark .hit { fill: transparent; cursor: default; }
.spark .tip { min-width: 0; width: 150px; }
.fgroups { display: grid; gap: 12px; }
.fgroup > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 4px 0; }
.fgroup > summary::-webkit-details-marker { display: none; }
.fgroup h3 { display: flex; gap: 6px; align-items: center; }
.fgroup .chev, details.store .chev { color: var(--muted); font-size: 15px; line-height: 1; width: 10px; transition: transform 0.15s; }

.arch .z { stroke: var(--border); stroke-width: 1; }

.arch .zt { font: 700 9.5px var(--font-ui); letter-spacing: 0.06em; fill: var(--muted); }
.arch .b { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
.arch .b.me { stroke: var(--accent); stroke-width: 1.5; }
.arch .b.hot { stroke: var(--serious); stroke-width: 2; }
.arch .b.ok { stroke: var(--good); stroke-width: 1.6; }
.arch .b.plan { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }   /* planned (v2 work package), not live yet */
/* live part status from the hub feed (H17: data-state on the part's <g>; data-stale = snapshot, stream down) */
.arch [data-state="ok"] > .b { stroke: var(--good); stroke-width: 1.8; }
.arch [data-state="warn"] > .b { stroke: var(--warning); stroke-width: 2.2; fill: var(--warning-wash); }

.arch [data-stale="1"] > .b { stroke-opacity: 0.55; }

.arch .div { stroke: var(--grid); stroke-width: 1; }
.arch .l { font: 600 11.5px var(--font-ui); fill: var(--ink); }

.arch .m { font: 9.5px var(--font-ui); fill: var(--muted); }

.arch .e, .dlegend .lg { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.arch .e.c, .dlegend .lg.c { stroke-dasharray: 4 3; }
.arch .e.hot, .dlegend .lg.hot { stroke: var(--serious); stroke-width: 2.6; }
.arch .e.ok, .dlegend .lg.ok { stroke: var(--good); stroke-width: 2; }
.arch .e.plan, .dlegend .lg.plan { stroke: var(--muted); stroke-dasharray: 1.5 3; }
.arch .mk { fill: var(--ink-2); } .arch .mk.hot { fill: var(--serious); } .arch .mk.ok { fill: var(--good); } .arch .mk.plan { fill: var(--muted); }
.arch .el { font: 9.5px var(--font-ui); fill: var(--ink-2); }

svg.arch-l .l { font-size: 13px; } svg.arch-l .s { font-size: 11.5px; } svg.arch-l .m, svg.arch-l .el, svg.arch-l .zt { font-size: 11px; }
.lock circle { fill: var(--surface); stroke: var(--good); stroke-width: 1.5; }
.lock rect { fill: var(--good); } .lock .sh { fill: none; stroke: var(--good); stroke-width: 1.4; }
.dlegend svg.lglock { width: 14px; height: 14px; }
.arch-notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-2); }

details.arch-how > summary { cursor: pointer; list-style: none; padding-block: 6px; }

@media (max-width: 759px) { svg.arch { width: calc(100% + 16px); max-width: none; margin: 0 -8px; } }   /* phones: use the panel padding, labels stay ~95 % size */
/* live data flow (flowd SSE at /live): clickable lines, flashes, side panel (desktop) / bottom sheet (phone) */
.arch [data-edge], .arch [data-node="main"] { cursor: pointer; outline: none; }

.arch [data-edge].ping .e { animation: live-ping 1.2s ease-out; }
.arch [data-node].ping .b { animation: live-pingb 1.2s ease-out; }
@keyframes live-ping { 0% { stroke: var(--accent); stroke-width: 6; } 100% { } }
@keyframes live-pingb { 0% { stroke: var(--accent); stroke-width: 4.5; } 100% { } }
@media (prefers-reduced-motion: reduce) { .arch [data-edge].ping .e, .arch [data-node].ping .b { animation: none; stroke: var(--accent); } }
.live-hint { margin: 0; text-align: center; }

  border: 1px solid var(--border); box-shadow: 0 10px 32px rgba(0, 0, 0, 0.22); }

  body.live-open { padding-right: clamp(300px, 36vw, 440px); } }   /* the page shrinks beside the drawer, never under it */
@media (max-width: 759px) { body.live-open { padding-bottom: 46vh; } aside.live { left: 0; right: 0; bottom: 0; height: 44vh; border-radius: 14px 14px 0 0; border-width: 1px 0 0; } }
.live-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--grid); }

.live-head button, .live-ev button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink); cursor: pointer; }
.live-dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.live-dot.on { background: var(--good); } .live-dot.err { background: var(--serious); }
.live-sub { padding: 6px 14px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--grid); }
.live-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 2px 14px 18px; }

  background: var(--surface-2); color: var(--accent-ink); cursor: pointer; }

.lf-row { display: flex; gap: 6px; align-items: center; min-width: 0; }

.lf-search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 6px 30px 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); -webkit-appearance: none; appearance: none; }

.lf-search input:focus-visible, .lf-grid select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  font-size: 13px; padding: 4px 8px; cursor: pointer; }

  background: var(--surface-2); color: var(--ink); cursor: pointer; white-space: nowrap; flex: none; }

  .live-filters { padding: 6px 12px; } .live-filters .lf-row > button { padding: 6px 9px; } }

/* ---- Agents tab: one card per agent (+ the Main row), live from flowd /live/agents; session drawer = .live geometry */

  background: var(--surface); border: 1px solid var(--border); }

.ag-card { display: grid; gap: 8px; text-align: left; width: 100%; box-sizing: border-box; font: inherit; color: var(--ink);

/* ---- Health and CI tabs: one card per component, problems first (System until 30.10) */

/* CI tab (no cards): a status bar, the speed strip, then flat sections: Lands (24 h chart + runs table), Tool
   suites on main (suites x main runs), Cron (jobs x hours). Phone: one column, the bar in two; desktop: the bar in one row,
   suites and cron side by side. */
#view-ci .empty { margin: 0; }
.ci-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--grid); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; }

.ci-seg .k { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); }

.ci-seg .sub { font-size: 12px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.ci-seg.warn .v { color: var(--warning-ink); }
.ci-seg.critical .v { color: var(--critical-ink); }
.ci-seg.main { grid-column: 1 / -1; background: var(--good-wash); }
.ci-seg.main .v { font-size: 24px; letter-spacing: -0.02em; line-height: 1.15; }
.ci-seg.main.ok .v, .ci-seg.main.ok .k, .ci-seg.main.ok .sub { color: var(--good-ink); }
.ci-seg.main.critical { background: var(--critical-wash); }
.ci-seg.main.critical .k, .ci-seg.main.critical .sub { color: var(--critical-ink); }
.ci-seg.main.unknown { background: var(--surface-3); }
.ci-seg.main .dotk { width: 10px; height: 10px; }
.ci-seg:last-child:nth-child(even) { grid-column: 1 / -1; }
@media (min-width: 760px) { .ci-bar { grid-template-columns: repeat(5, minmax(0, 1fr)); } .ci-seg:last-child:nth-child(even) { grid-column: auto; } }
@media (min-width: 1100px) { .ci-bar { grid-template-columns: 1.3fr repeat(5, minmax(0, 1fr)); } .ci-seg.main { grid-column: auto; } }
.dotk.run { background: var(--warning); animation: ci-pulse 1.6s ease-in-out infinite; }
@keyframes ci-pulse { 50% { opacity: 0.3; } }
.ci-speed { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; background: var(--grid); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; }
@media (min-width: 760px) { .ci-speed { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ci-speed > .empty { background: var(--surface); padding: 12px 14px; font-size: 13px; color: var(--muted); }
.spk { background: var(--surface); padding: 9px 14px; display: grid; grid-template-columns: minmax(88px, auto) minmax(0, 1fr);

.spk .k { grid-area: k; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.spk .v { grid-area: v; font: 500 17px/1.25 var(--font-mono); letter-spacing: -0.02em; }
.spk .b { grid-area: b; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.spk .b .chip { font-size: 10.5px; padding: 0 6px; }
.spk svg { grid-area: sv; width: 100%; height: 36px; display: block; overflow: visible; touch-action: pan-y; }
.spk svg .ln { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spk svg .bl { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
.spk svg .end, .spk svg .end-ring { fill: none; stroke-linecap: round; }
.spk svg .end { stroke: var(--s1); stroke-width: 7; }
.spk svg .end-ring { stroke: var(--surface); stroke-width: 11; }
.spk svg .cur { stroke: var(--axis); stroke-width: 1; }
.spk svg .hit { fill: transparent; cursor: crosshair; }
.spk .rd { grid-area: rd; font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.ci-sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: grid; gap: 12px;
  min-width: 0; align-content: start; }
.ci-sec { --ci-wait: color-mix(in srgb, var(--muted) 75%, var(--surface)); }   /* the lands' wait blocks (both themes via --muted) */
.ci-sec.warn { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); }
.ci-sec.critical { border-color: color-mix(in srgb, var(--critical) 55%, var(--border)); }
.ci-sec > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }

.ci-nums { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--muted); }
.ci-nums b { font: 600 13px var(--font-mono); color: var(--ink); }

.ci-nums .skip { color: var(--warning-ink); }
.ci-pair { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .ci-pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); } }
.ci-seg.flash, .ci-sec.flash, .ci-speed.flash { animation: ci-flash 1.4s ease-out; }
/* Health: "How I'm doing" (no cards): a heading, a strip of four tiles in the CI speed strip's look, then Failures and

.hd { display: grid; gap: 12px; min-width: 0; }
.hd-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 0 2px; }
.hd-h h2 { font-size: 15.5px; }

.hd-row { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "k t" "bar bar"; gap: 4px 12px; align-items: baseline;
  padding: 8px 2px; border-top: 1px solid var(--grid); min-width: 0; }
.hd-row:first-child { border-top: 0; padding-top: 0; }
.hd-row .k { grid-area: k; font-size: 13px; font-weight: 600; white-space: nowrap; }
.hd-row .t { grid-area: t; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .hd-row .t { text-align: left; } }
.hd-wk { display: grid; grid-template-columns: 94px minmax(0, 1fr) 58px; gap: 7px 10px; align-items: center; min-width: 0; }
.hd-wk .k { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.hd-wk .v { font: 500 12.5px var(--font-mono); text-align: right; white-space: nowrap; }
.hd-wk .cols { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; height: 26px; border-bottom: 1px solid var(--axis); min-width: 0; }
.hd-wk .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; border-radius: 2px 2px 0 0; }
.hd-wk .col.today { background: var(--surface-3); }
.hd-wk .col i { display: block; flex: none; }
.hd-wk .col i:first-child { border-radius: 2px 2px 0 0; }
.hd-wk .col .n { background: color-mix(in srgb, var(--s1) 60%, var(--surface)); } .hd-wk .col.today .n { background: var(--s1); }
.hd-wk .col .g { background: var(--good); } .hd-wk .col .r { background: var(--critical); } .hd-wk .col .a { background: var(--warning); }
.hd-wk .ax { grid-column: 2; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; font: 10.5px var(--font-mono); color: var(--muted);
  text-align: center; margin-top: -3px; }

@keyframes ci-flash { 0% { box-shadow: inset 0 0 0 3px var(--accent); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
.ci-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); }
.ci-leg > span { display: inline-flex; align-items: center; gap: 5px; }

.ci-tl { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 3px 8px; align-items: center; }

.ci-tl .mk.deploy { width: 8px; height: 8px; top: 3px; margin-left: -4px; transform: rotate(45deg); background: var(--s6); }

.ci-tl .mk.bad { background: var(--critical); z-index: 1; }
.ci-tl .bars { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 64px; border-bottom: 1px solid var(--axis); }
.ci-tl .col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.ci-tl .col i { display: block; min-height: 2px; }
.ci-tl .col i:first-child { border-radius: 2px 2px 0 0; }
.ci-tl .col .g { background: var(--good); } .ci-tl .col .r { background: var(--critical); }
.ci-tl .ax { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); font: 10.5px var(--font-mono); color: var(--muted); }

.ci-runs { display: grid; min-width: 0; }

.ci-runs .d { grid-area: d; font: 12px var(--font-mono); text-align: right; white-space: nowrap; }
.ci-runs .t { grid-area: t; font: 12px var(--font-mono); color: var(--muted); text-align: right; white-space: nowrap; }

.ci-runs details.table { border-top: 1px solid var(--grid); }

.ci-runs .tlb { position: relative; display: block; height: 13px; }

.ci-runs .tlb .ln.a { top: 0; } .ci-runs .tlb .ln.b { bottom: 0; }

.ci-steps .bar { background: var(--surface-2); }
.ci-steps .bar i { min-width: 3px; border-radius: 1px; }
.ci-steps .gh { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.ci-steps .gh b { color: var(--ink-2); font-weight: 600; }
.ci-steps .st { display: contents; }
.ci-steps .nm { font: 11.5px var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

<svg class="arch arch-p" viewBox="0 0 360 1134" role="img" aria-label="Architecture of the assistant as of 30.10. You reach me through Telegram, the Claude app and the phone app. Telegram and the phone app first reach the hub: the Telegram adapter (claude-hub-tg) owns the bot, and the phone gateway (claude-hub-phone) holds the app link and pushes; both go through the hub store (events in, outbox out) to the main session in the claude-bot container. The voice relay (claude-hub-voice, live calls with Gemini) and the headed Chrome (claude-hub-browser, which I drive over MCP) also run in their own hub containers, as do the CI runner (claude-hub-ci), Postgres (claude-hub-pg) and Phoenix (claude-hub-phoenix): eight in all. I call 103 typed tools through the MCP gateway in claude-hub; a tool worker in my container runs them. claude-hub keeps events, approvals, the to-do board and durable workflows in Postgres; its only two schedules are the reminder timers and the event workflows. Its egress injector puts the 12 API keys on the wire (only transfers over 8 MiB, for Home Assistant, the phone and big vault releases, still use local keys). Everything I read goes to the Anthropic API. Your private data stays in the claude-vault container: I get only answers and flags, and text only after your approval in the vault bot. Claude Code telemetry goes through a local receiver to Phoenix. 129 cron jobs wake me through ~/inbox notes, reach the Unraid server over ssh and APIs, and publish this dashboard to the nginx VM every 5 minutes; its live views (flowd on port 8790, and the hub feed on port 8791 to claude-hub port 8702) reach the nginx VM through reverse ssh tunnels from my container. The nginx VM also carries the phone app's internet route. The server runs the one-tap kit runner for hub updates.">

<svg class="arch arch-l" viewBox="0 0 1200 750" role="img" aria-label="Architecture of the assistant as of 30.10. You reach me through Telegram, the Claude app and the phone app. Telegram and the phone app first reach the hub: the Telegram adapter (claude-hub-tg) owns the bot, and the phone gateway (claude-hub-phone) holds the app link and pushes; both go through the hub store (events in, outbox out) to the main session in the claude-bot container. The voice relay (claude-hub-voice, live calls with Gemini) and the headed Chrome (claude-hub-browser, which I drive over MCP) also run in their own hub containers, as do the CI runner (claude-hub-ci), Postgres (claude-hub-pg) and Phoenix (claude-hub-phoenix): eight in all. I call 103 typed tools through the MCP gateway in claude-hub; a tool worker in my container runs them. claude-hub keeps events, approvals, the to-do board and durable workflows in Postgres; its only two schedules are the reminder timers and the event workflows. Its egress injector puts the 12 API keys on the wire (only transfers over 8 MiB, for Home Assistant, the phone and big vault releases, still use local keys). Everything I read goes to the Anthropic API. Your private data stays in the claude-vault container: I get only answers and flags, and text only after your approval in the vault bot. Claude Code telemetry goes through a local receiver to Phoenix. 129 cron jobs wake me through ~/inbox notes, reach the Unraid server over ssh and APIs, and publish this dashboard to the nginx VM every 5 minutes; its live views (flowd on port 8790, and the hub feed on port 8791 to claude-hub port 8702) reach the nginx VM through reverse ssh tunnels from my container. The nginx VM also carries the phone app's internet route. The server runs the one-tap kit runner for hub updates.">

<details class="arch-how"><summary class="panel-head"><h2>How it works</h2><span class="note">18 short notes · tap to open</span></summary>
<ul class="arch-notes">
<li><b>Telegram:</b> the Telegram adapter runs in its own hub container (claude-hub-tg): it owns the bot, polls, and sends from the hub outbox. The telegram-plus plugin in my session is only a bridge: events in, outbox out, through the hub store.</li>
<li><b>Phone app:</b> its gateway runs in claude-hub-phone (app link, pushes, app chat). The server publishes only its port 6080; from the internet the app comes in through the nginx VM on port 8443.</li>
<li><b>Voice calls:</b> the voice relay runs in claude-hub-voice and talks to Gemini Live; it hands requests to me through the hub.</li>
<li><b>Browser:</b> the headed Chrome runs in claude-hub-browser. I drive it over MCP through its browser service on port 9223; you watch it through the phone front.</li>
<li><b>Typed tools:</b> I call 103 typed tools through the MCP gateway in claude-hub (vault, Home Assistant, media, calendar, phone, voice, web and more); a tool worker in my container runs them, so vault tools still go through the vault CLI.</li>
<li><b>The hub</b> runs on the server as eight containers: claude-hub (hubd: event store, outbox, approvals, the to-do board and durable DBOS workflows), Postgres, Phoenix, the CI runner and the Telegram, phone, voice and browser containers.</li>
<li><b>Jobs:</b> periodic jobs run from cron in my container (129); the hub keeps only two schedules: the reminder timers and the event workflows (nights, parties, sleep-in). The nightly session rotation is on.</li>
<li><b>Board:</b> my to-do board lives in the hub store; TODO.md is its rendering, and done-when checks close items by themselves.</li>
<li><b>Keys:</b> the hub's egress injector holds copies of 12 API keys and swaps them in on the way out: every one goes out through it (Radarr's long list comes in 8 MiB pages). Only transfers over 8 MiB still use local keys: Home Assistant, the phone and big vault releases. The 12 bindings run in audit mode: a wrong destination is logged, not yet blocked.</li>
<li><b>This page:</b> a cron job copies it with a 5-minute snapshot to the nginx VM; its live views (flowd on port 8790, the hub feed on port 8791 to claude-hub port 8702) reach the VM through reverse ssh tunnels from my container.</li>
<li><b>Hub updates:</b> a one-tap kit runner on the server applies hub container updates: image-only bumps by themselves, config changes after your tap.</li>
<li><b>Traces:</b> Claude Code sends its telemetry to a local receiver, which passes only numbers and categories on to Phoenix (kept 30 days).</li>
<li><b>Waking up:</b> events from jobs and watchers land in the hub's events ledger and come to me as an agenda; cron jobs still leave notes in ~/inbox; hb-gate decides when the heartbeat wakes me.</li>
<li><b>Guards:</b> every tool call passes two hooks: vault-guard (no way around the vault) and risk-check (blocks risky commands).</li>
<li><b>Privacy:</b> the vault's local LLM answers inside the vault. Text and exact details leave only after your approval in the vault bot.</li>
<li><b>Documents</b> you send to the vault bot are filed into paperless without passing me.</li>
<li><b>My setup</b> is snapshotted to brain git every 30 min, backed up to the server nightly and synced to a private GitHub repo.</li>
<li><b>Calendar</b> goes through the claude.ai connector.</li>
</ul></details>

    liveCount();
  }
  function lfPrune() {   // the time window moved on: drop rows that fell out of it
    live.list.querySelectorAll('.live-ev').forEach(function (r) { if (!lfMatch(r.lfEv)) r.remove(); });
    liveCount();
  }
  function liveCount() {
    var held = 0, total = 0, shown = live.list.querySelectorAll('.live-ev').length, none = live.list.querySelector('.lf-none');
    live.buf.forEach(function (e) { if (e._held) held++; else total++; });
    live.count.textContent = !total ? '' : lfActive() ? shown + ' of ' + total + ' shown' : total + ' event' + (total > 1 ? 's' : '');
    if (live.paused) live.stext.textContent = 'paused' + (held ? ' · ' + held + ' new' : '');
    if (!shown && total && lfActive()) {
      if (!none) {
        none = lel('div', 'live-empty lf-none', 'No events match the filters. ');
        var b = lel('button', null, 'Reset filters');
        b.type = 'button';
        b.addEventListener('click', function () { live.f = lfDefault(); lfApply(); });
        none.appendChild(b);
        live.list.appendChild(none);
      }
    } else if (none) none.remove();
  }
  function liveKnown(key) { return key === 'all' || !!LIVE_MAP[key] || !!LIVE_NONE[key] || !!document.querySelector('svg.arch [data-edge="' + key + '"]'); }
  window.addEventListener('hashchange', function () {   // a bookmark pasted into an open tab: follow it (replaceState never fires this)
    var hp = parseHash(location.hash);
    if (VIEW_ALIAS[hp.view]) { go(hp.view); return; }   // an old tab name: go() maps it and rewrites the hash
    if (VIEWS.indexOf(hp.view) < 0) return;
    if (hp.view !== current) go(hp.view, true);
    if (hp.view !== 'architecture') return;
    if (hp.live && liveKnown(hp.live)) liveOpen(hp.live, hp.f);
    else if (!hp.live && live.key) liveClose();
  });
  function liveFlash(p) {
    var keys = [];
    if (p.edge === 'me→vault') keys = [p.kind === 'vault_result' ? 'filter-vaultcli' : 'vaultcli-filter'];
    else Object.keys(LIVE_MAP).forEach(function (k) { if (LIVE_MAP[k].indexOf(p.edge) >= 0) keys.push(k); });
    keys.forEach(function (k) {
      document.querySelectorAll(liveSel(k)).forEach(function (g) {
        g.classList.remove('ping');
        void g.getBoundingClientRect();
        g.classList.add('ping');
        clearTimeout(g.livePt);
        g.livePt = setTimeout(function () { g.classList.remove('ping'); }, 1300);
      });
    });
  }
  function livePulse(on) {
    on = on && liveOk() && !document.hidden;
    if (on && !live.pulse) {
      var es = new EventSource('live?pulse=1');
      es.addEventListener('pulse', function (m) { try { liveFlash(JSON.parse(m.data)); } catch (err) { /* ignore */ } });
      es.addEventListener('pulse', function () { sseOk('pulse'); });
      es.onerror = function () {
        if (es.readyState === 2 && live.pulse === es) { live.pulse = null; sseRetry('pulse', function () { livePulse(current === 'architecture'); }); }
      };
      live.pulse = es;
    } else if (!on && live.pulse) { live.pulse.close(); live.pulse = null; }
  }
  document.addEventListener('visibilitychange', function () { livePulse(current === 'architecture'); });
  function liveWire(root) {
    root.querySelectorAll('svg.arch [data-edge], svg.arch [data-node="main"]').forEach(function (g) {
      var key = g.hasAttribute('data-edge') ? g.getAttribute('data-edge') : 'node:main', path = g.querySelector('path.e');
      if (path) {
        var hit = path.cloneNode(false);
        hit.setAttribute('class', 'hit');
        hit.removeAttribute('marker-start');
        hit.removeAttribute('marker-end');
        g.insertBefore(hit, g.firstChild);
      }
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', 'Watch live: ' + (LIVE_TITLE[key] || key));
      g.addEventListener('click', function () { liveOpen(key); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); liveOpen(key); } });
    });
    var fig = root.querySelector('.arch-fig');
    if (fig) {
      var hint = lel('p', 'note live-hint', 'Tap a line, or the Main session box, to watch its traffic live.'), ab = lel('button', 'live-all', 'All traffic');
      ab.type = 'button';
      ab.addEventListener('click', function () { liveOpen('all'); });
      hint.appendChild(ab);
      fig.appendChild(hint);
    }
    liveMark();
  }

  // ---------------------------------------------------------------- boot
  function renderAll() {
    charts = {};
    VIEWS.forEach(function (x) { document.getElementById('view-' + x).textContent = ''; });
    renderHeader();
    var R = { health: renderHealth, ci: renderCI, agents: renderAgents, today: renderToday, usage: renderUsage, activity: renderActivity, codebase: renderCodebase, privacy: renderPrivacy, architecture: renderArchitecture };
    VIEWS.forEach(function (x) {
      try { R[x](document.getElementById('view-' + x)); }
      catch (e) { document.getElementById('view-' + x).appendChild(h('div', { class: 'err', text: 'This section could not be drawn: ' + e.message })); }
    });
    var f = document.getElementById('footer');
    f.textContent = '';
    f.appendChild(h('span', { text: 'Built by dash-data at ' + D.generated_local + ' Zurich time in ' + D.build_seconds + ' s. Numbers only: no message text, no secrets, no addresses (the Architecture tab\u2019s live view streams filtered text on demand; the Agents tab shows tool names and the agents\u2019 own short, filtered lines).' }));
    f.appendChild(h('span', { text: 'This page loads nothing from other sites.' }));
    go(current, true, true, true);
    if (!booted) { booted = true; beacon.load(current); }
    hubConnect();
  }
  // ---------------------------------------------------------------- data refresh (never a manual reload)
  // data.json every REFRESH_MS, and at once when the page is back in view (at most every 10 s); a new snapshot redraws
  // every tab in place: the scroll position and each fold he opened or closed stay as they were. The live streams
  // (hub feed, /live/*) reconnect by themselves (sseRetry); the "Data from" line ticks every 15 s, stale after 10 min.
  var REFRESH_MS = 60 * 1000, FRESH_TICK_MS = 15 * 1000, lastFetch = 0;
  // New page code after a deploy: dash-data writes the template's hash into this page (meta dash-version) and into
  // data.json (page_version). When a refresh sees them differ, the tab reloads itself (tab in the hash; scroll and folds
  // via sessionStorage), at most once per version (one retry after 5 min if that reload still got the old copy), never
  // while he types, selects text or touched the page in the last 30 s: then on the next focus or refresh instead.
  /* reload:start */
  function pageReloader(o) {   // o: own version, now(), busy(), store {get, set}, save(), reload()
    var KEY = 'dash-reload', RETRY_MS = 5 * 60 * 1000, pending = null;
    function mark() { try { return JSON.parse(o.store.get(KEY) || 'null') || {}; } catch (e) { return null; } }
    function due(v) {
      if (!o.own || !v || typeof v !== 'string' || v === o.own) return false;
      var m = mark();
      return !!m && (m.v !== v || ((m.n || 0) < 2 && o.now() - (m.t || 0) > RETRY_MS));
    }
    function run(v) {
      if (o.busy()) { pending = v; return 'later'; }
      var m = mark(), next = JSON.stringify({ v: v, n: m.v === v ? (m.n || 0) + 1 : 1, t: o.now() });
      try { o.store.set(KEY, next); if (o.store.get(KEY) !== next) return false; } catch (e) { return false; }   // no guard, no reload
      pending = null;
      try { o.save(); } catch (e) { /* the view state is a nicety */ }
      o.reload();
      return 'reload';
    }
    return {
      check: function (v) { if (!due(v)) { pending = null; return false; } return run(v); },
      focus: function () { return pending && due(pending) ? run(pending) : false; }
    };
  }
  /* reload:end */
  var BUSY_MS = 30 * 1000, lastTouch = 0, RESTORE_KEY = 'dash-reload-view';
  ['pointerdown', 'keydown', 'input', 'wheel', 'touchstart'].forEach(function (ev) {   // a fold he opens = a pointer or key
    document.addEventListener(ev, function () { lastTouch = Date.now(); }, { capture: true, passive: true });
  });
  function pageBusy() {
    var a = document.activeElement, sel = '';
    try { sel = String(window.getSelection ? window.getSelection() : ''); } catch (e) { /* no selection API */ }
    return !!(a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) || sel.length > 0 || Date.now() - lastTouch < BUSY_MS;
  }
  var reloader = pageReloader({
    own: (document.querySelector('meta[name="dash-version"]') || {}).content || '',
    now: Date.now, busy: pageBusy,
    store: { get: function (k) { return sessionStorage.getItem(k); }, set: function (k, v) { sessionStorage.setItem(k, v); } },
    save: function () {
      var folds = {};
      foldKeys(function (k, d) { folds[k] = d.open; });
      sessionStorage.setItem(RESTORE_KEY, JSON.stringify({ view: current, y: window.scrollY, folds: folds, t: Date.now() }));
    },
    reload: function () { location.reload(); }
  });
  var restore = null;   // the view state saved just before a version reload: used once, by the first render
  try { restore = JSON.parse(sessionStorage.getItem(RESTORE_KEY) || 'null'); sessionStorage.removeItem(RESTORE_KEY); } catch (e) { restore = null; }
  if (!restore || typeof restore !== 'object' || !(Date.now() - (restore.t || 0) < 5 * 60 * 1000)) restore = null;
  function foldKeys(cb) {   // each <details> in the tabs: tab | nearest id | its summary without numbers | nth such
    VIEWS.forEach(function (x) {
      var seen = {};
      document.getElementById('view-' + x).querySelectorAll('details').forEach(function (d) {
        var sm = d.querySelector('summary'), host = d.parentNode && d.parentNode.closest ? d.parentNode.closest('[id]') : null;
        var k = x + '|' + (host ? host.id : '') + '|' + (sm ? sm.textContent : '').replace(/[\d.,:$%]+/g, '#').trim();
        seen[k] = (seen[k] || 0) + 1;
        cb(k + '|' + seen[k], d);
      });
    });
  }
  function start(data) {
    var again = !!(D && D.tokens && data && data.tokens), folds = {}, y = window.scrollY;
    if (again) foldKeys(function (k, d) { folds[k] = d.open; });
    D = data;
    if (!D || !D.tokens) {
      document.getElementById('view-health').appendChild(h('div', { class: 'err', text: 'No dashboard data yet. Run dash-data on the bot to create it.' }));
      return;
    }
    renderAll();
    if (!again && restore) { folds = restore.folds && typeof restore.folds === 'object' ? restore.folds : {}; y = +restore.y || 0; again = true; restore = null; }
    if (again) {
      foldKeys(function (k, d) { if (k in folds && d.open !== !!folds[k]) d.open = !!folds[k]; });
      window.scrollTo(0, y);
    }
    updateFresh();
  }
  var hp = parseHash(location.hash), initial = viewOf(hp.view);
  if (hp.live && initial === 'architecture') live.boot = { key: hp.live, f: hp.f };
  if (initial === 'agents') { var agm = /[#&]agent=(main|a[0-9a-f]{6,24})(?:&|$)/.exec(location.hash); if (agm) AG.boot = agm[1]; }
  if (VIEW_ALIAS[hp.view]) { try { history.replaceState(null, '', '#' + initial); } catch (e) { /* sandboxed */ } }   // #system -> #health
  if (VIEWS.indexOf(initial) < 0 && restore && VIEWS.indexOf(viewOf(restore.view)) >= 0) initial = viewOf(restore.view);
  if (VIEWS.indexOf(initial) < 0) { try { initial = viewOf(localStorage.getItem('dash-view2') || 'health'); } catch (e) { initial = 'health'; } }
  current = VIEWS.indexOf(initial) >= 0 ? initial : 'health';
  var block = document.getElementById('dash-data');
  var inline = null;
  try { inline = JSON.parse(block.textContent); } catch (e) { inline = null; }
  var mode = block.getAttribute('data-mode');
  function refresh(first) {
    lastFetch = Date.now();
    return fetch('data.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (reloader.check(d && d.page_version) === 'reload') return;   // new page code: reload instead of redrawing
        if (first || !D || d.generated_at !== D.generated_at) start(d);
      })
      .catch(function () { if (first) start(inline); });
  }
  if (mode === 'inline' || !/^https?:/.test(location.protocol)) start(inline);
  else {
    refresh(true);
    setInterval(function () { if (!document.hidden) refresh(false); }, REFRESH_MS);
    var back = function () {
      if (document.hidden || reloader.focus() === 'reload') return;   // a reload put off while he was busy
      if (Date.now() - lastFetch > 10000) refresh(false);
    };
    document.addEventListener('visibilitychange', back);
    window.addEventListener('focus', back);
    window.addEventListener('online', back);
  }
  setInterval(updateFresh, FRESH_TICK_MS);
})();
</script>
